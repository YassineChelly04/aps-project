<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sijar · Planification de la distribution et des tournées</title>
<script>try{var t=localStorage.getItem('sijar.theme');if(t==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23121417'/%3E%3Cg stroke='%23F6C000' stroke-width='3.2' fill='none'%3E%3Cpath d='M20 27V17M20 17L9 9M20 17L31 9M20 17V7'/%3E%3C/g%3E%3Crect x='14' y='26' width='12' height='9' fill='%23F6C000'/%3E%3Cg fill='%23F6C000'%3E%3Ccircle cx='9' cy='9' r='4'/%3E%3Ccircle cx='31' cy='9' r='4'/%3E%3Ccircle cx='20' cy='6' r='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Martian+Mono:wdth,wght@75..112.5,300..600&family=Reem+Kufi:wght@500..700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="sijar.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hazard" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" style="fill:var(--sur-jaune)"/><rect width="9" height="18" style="fill:var(--jaune)"/>
    </pattern>
    <symbol id="logo" viewBox="0 0 40 40">
      <g stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="square"><path d="M20 27V17M20 17L9 9M20 17L31 9M20 17V7"/></g>
      <rect x="14" y="26" width="12" height="10" fill="currentColor"/>
      <circle cx="9" cy="9" r="4.2" fill="currentColor"/><circle cx="31" cy="9" r="4.2" fill="currentColor"/><circle cx="20" cy="6" r="4.2" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
<canvas id="fond" aria-hidden="true"></canvas>
<div class="app">
  <aside class="side">
    <a class="lock" href="#donnees" aria-label="Sijar, accueil"><svg aria-hidden="true"><use href="#logo"/></svg><b>SIJAR</b><i lang="ar">شجر</i></a>
    <nav aria-label="Étapes"><ul class="nav" id="nav"></ul></nav>
    <div class="side-foot">
      <span class="lab">Instance</span><span class="mono" id="pied-inst">—</span>
      <span class="lab">Scénario</span><span class="mono" id="pied-scn">—</span>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <div class="crumb"><span class="zone" id="zone">DATA</span><h1 id="titre">Données</h1></div>
      <div class="bar-r">
        <button class="next" type="button" id="suivant" hidden><span>Prochaine action</span><b id="suivant-txt"></b></button>
        <button class="icon-btn" type="button" id="theme" aria-label="Basculer le thème clair ou sombre" title="Thème clair / sombre">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <main class="vues">
      <section class="view" id="v-donnees" data-vue="donnees"></section>
      <section class="view" id="v-affectation" data-vue="affectation" hidden></section>
      <section class="view" id="v-classeur" data-vue="classeur" hidden></section>
      <section class="view" id="v-tournees" data-vue="tournees" hidden></section>
      <section class="view" id="v-plan" data-vue="plan" hidden></section>
      <section class="view" id="v-scenarios" data-vue="scenarios" hidden></section>
    </main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
